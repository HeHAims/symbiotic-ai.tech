name: node01-ci

on:
  push:
    branches: ["main", "master", "node01-clean"]
    paths:
      - "node01/**"
      - ".github/workflows/node01-ci.yml"
  pull_request:
    paths:
      - "node01/**"
      - ".github/workflows/node01-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node01
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Governance compile
        run: |
          python -m py_compile app.py chimera_engine_production.py

      - name: Run tests
        run: |
          pytest -q

      - name: Deterministic hash check
        run: |
          python chimera_engine_production.py --verify-hash

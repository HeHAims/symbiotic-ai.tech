<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Contact - Symbiotic AI</title><style>body{margin:0;font-family:Montserrat,Arial,sans-serif;background:#0d1020;color:#ece7ff}header,main,footer{max-width:980px;margin:0 auto;padding:24px}nav a{color:#d7b2ff;margin-right:12px;text-decoration:none}.card{border:1px solid #5d3d8f;border-radius:10px;padding:14px;margin:12px 0;background:rgba(255,255,255,.04)}input,textarea{width:100%;padding:10px;margin:6px 0 12px}</style></head><body><header><h1>Contact Us</h1><nav><a href="index.html">Home</a><a href="about.html">About</a><a href="architecture.html">Architecture</a><a href="research.html">Research</a><a href="docs/index.html">Docs</a></nav></header><main><div class="card"><p>Email: <a href="mailto:info@symbiotic-ai.tech">info@symbiotic-ai.tech</a></p></div><form class="card" id="contactForm" action="https://formspree.io/f/your-form-id" method="POST" novalidate><label>Name</label><input name="name" required><label>Email</label><input type="email" name="email" required><label>Message</label><textarea name="message" rows="5" required></textarea><button type="submit">Submit</button><p id="formMsg"></p></form></main><footer><p>&copy; 2026 Symbiotic AI LLC</p></footer><script>document.getElementById('contactForm').addEventListener('submit',async function(e){e.preventDefault();const msg=document.getElementById('formMsg');if(this.action.includes('your-form-id')){msg.textContent='Form endpoint not configured yet.';return;}const res=await fetch(this.action,{method:'POST',body:new FormData(this),headers:{'Accept':'application/json'}});msg.textContent=res.ok?'Message sent.':'Submission failed.';if(res.ok)this.reset();});</script></body></html>

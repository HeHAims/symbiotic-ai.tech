<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Contact - Symbiotic AI</title><link rel="stylesheet" href="assets/styles.css"/></head>
<body>
<header><h1>Contact Us</h1><nav aria-label="Primary"><a href="index.html">Home</a><a href="about.html">About</a><a href="architecture.html">Architecture</a><a href="research.html">Research</a><a href="docs/index.html">Docs</a><a href="privacy.html">Privacy</a><a href="legal.html">Legal</a><span class="top-actions"><button data-theme-toggle type="button">Light Mode</button></span></nav></header>
<main>
  <div class="card">
    <p>Email: <a href="mailto:info@symbiotic-ai.tech">info@symbiotic-ai.tech</a></p>
    <p>For support, send safe/unsafe test prompts to the API documented in docs.</p>
  </div>
  <form id="contactForm" class="card" action="https://formspree.io/f/your-form-id" method="POST" novalidate>
    <h2>Send a Message</h2>
    <label for="name">Name</label><br/>
    <input id="name" name="name" required aria-required="true" style="width:100%;padding:10px;margin:6px 0 12px;" />
    <label for="email">Email</label><br/>
    <input id="email" type="email" name="email" required aria-required="true" style="width:100%;padding:10px;margin:6px 0 12px;" />
    <label for="message">Message</label><br/>
    <textarea id="message" name="message" required aria-required="true" rows="5" style="width:100%;padding:10px;margin:6px 0 12px;"></textarea>
    <button type="submit">Submit</button>
    <p id="formMsg" class="small" role="status" aria-live="polite"></p>
  </form>
</main>
<footer><p>&copy; 2026 Symbiotic AI LLC</p></footer>
<script src="assets/site.js"></script>
<script>
document.getElementById('contactForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  const form = e.currentTarget;
  const msg = document.getElementById('formMsg');
  const data = new FormData(form);
  const email = (data.get('email') || '').toString();
  if (!email.includes('@')) { msg.textContent = 'Please provide a valid email.'; return; }
  if (form.action.includes('your-form-id')) {
    msg.textContent = 'Form endpoint not configured yet. Replace Formspree form ID to enable submissions.';
    return;
  }
  try {
    const res = await fetch(form.action, { method: 'POST', body: data, headers: { 'Accept': 'application/json' } });
    msg.textContent = res.ok ? 'Message sent successfully.' : 'Submission failed. Try again later.';
    if (res.ok) form.reset();
  } catch {
    msg.textContent = 'Network error. Please email info@symbiotic-ai.tech.';
  }
});
</script>
</body></html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Symbiotic AI | CMIS Node_01</title>
  <style>
    :root {
      --bg: #090c10;
      --panel: #11161d;
      --accent: #1dd9b6;
      --warn: #f97373;
      --text: #dce6f5;
      --muted: #9fb0c5;
    }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at 20% 10%, #14202f, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: grid;
      grid-template-columns: 360px 1fr;
    }
    .left {
      border-right: 1px solid #1d2733;
      background: linear-gradient(160deg, #0f141c, #0b1118);
      padding: 30px;
    }
    .right {
      padding: 30px;
    }
    h1 {
      margin: 12px 0;
      letter-spacing: 0.8px;
    }
    .badge {
      color: var(--accent);
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1.5px;
    }
    .meta {
      color: var(--muted);
      line-height: 1.8;
      font-size: 14px;
    }
    textarea {
      width: 100%;
      min-height: 160px;
      background: #0f141c;
      border: 1px solid #263242;
      color: var(--text);
      border-radius: 10px;
      padding: 12px;
      box-sizing: border-box;
    }
    button {
      margin-top: 12px;
      background: var(--accent);
      color: #001510;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .result {
      margin-top: 20px;
      background: var(--panel);
      border: 1px solid #223040;
      border-radius: 10px;
      padding: 14px;
      white-space: pre-wrap;
    }
    .status-ok { color: var(--accent); }
    .status-refuse { color: var(--warn); }
  </style>
</head>
<body>
  <aside class="left">
    <div class="badge">CMIS_GOVERNANCE_ACTIVE</div>
    <h1>SYMBIOTIC AI</h1>
    <div class="meta">
      <div><strong>Node ID:</strong> CMIS-PROD-2026</div>
      <div><strong>Engine:</strong> Chimera_v1.0.0</div>
      <div><strong>Logic:</strong> p = v*x + a</div>
      <div><strong>Route:</strong> POST /cmis</div>
    </div>
  </aside>
  <main class="right">
    <h2>Governance Interceptor</h2>
    <p>Submit a request to test deterministic allow/refuse routing before upstream model execution.</p>
    <textarea id="prompt" placeholder="Classify risk for medical protocol X"></textarea>
    <br>
    <button id="send">Evaluate</button>
    <div id="result" class="result">No request sent yet.</div>
  </main>
  <script>
    const btn = document.getElementById("send");
    const promptInput = document.getElementById("prompt");
    const result = document.getElementById("result");

    btn.addEventListener("click", async () => {
      const input = promptInput.value.trim();
      if (!input) {
        result.textContent = "Input is required.";
        return;
      }

      result.textContent = "Evaluating...";
      try {
        const res = await fetch("/cmis", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ input, mode: "governance", language: "en" })
        });
        const data = await res.json();
        const statusClass = data.decision === "REFUSE" ? "status-refuse" : "status-ok";
        result.innerHTML = `<div class="${statusClass}"><strong>${data.decision || "UNKNOWN"}</strong></div>` +
          `Trace: ${data.trace_id || "n/a"}\n` +
          `Score: ${data.score || "n/a"}\n` +
          `Reason: ${data.reason || "n/a"}\n` +
          `Audit: ${data.audit_backend || "n/a"} -> ${data.audit_location || "n/a"}\n\n` +
          JSON.stringify(data.model_response || {}, null, 2);
      } catch (err) {
        result.textContent = `Request failed: ${err}`;
      }
    });
  </script>
</body>
</html>
